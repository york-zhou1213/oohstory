<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="refresh" content="60">
  <title>站点维护中 | OOHStory</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eaf6fc;
      --canvas-deep: #d8edf8;
      --ink: #0c2840;
      --muted: #526f82;
      --accent: #247ebd;
      --accent-strong: #0f669f;
      --panel: rgba(250, 253, 255, .82);
      --line: rgba(36, 126, 189, .22);
      --shadow: 0 28px 80px rgba(22, 82, 119, .16);
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--canvas); }
    body {
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 12%, rgba(102, 190, 232, .27), transparent 28rem),
        radial-gradient(circle at 86% 88%, rgba(74, 151, 198, .2), transparent 30rem),
        linear-gradient(145deg, var(--canvas), var(--canvas-deep));
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: .28;
      background-image: repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.23) 19px 20px);
      mask-image: linear-gradient(to bottom, #000, transparent 62%);
    }
    main {
      position: relative;
      z-index: 1;
      display: grid;
      width: min(1120px, calc(100% - 40px));
      min-height: 100dvh;
      margin: 0 auto;
      place-items: center;
      padding: max(28px, env(safe-area-inset-top)) 0 max(28px, env(safe-area-inset-bottom));
    }
    .maintenance-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(280px, .82fr);
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }
    .copy {
      display: flex;
      min-height: 590px;
      flex-direction: column;
      justify-content: center;
      padding: clamp(42px, 7vw, 84px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      width: fit-content;
      margin-bottom: clamp(52px, 9vw, 96px);
      color: inherit;
      text-decoration: none;
    }
    .brand img { width: 48px; height: 48px; border-radius: 15px; box-shadow: 0 10px 24px rgba(24, 103, 151, .2); }
    .brand span { display: grid; gap: 1px; }
    .brand strong { font-size: 1rem; letter-spacing: -.02em; }
    .brand small { color: var(--muted); font-size: .68rem; letter-spacing: .14em; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      margin-bottom: 20px;
      color: var(--accent-strong);
      font-size: .78rem;
      font-weight: 760;
    }
    .status::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(36, 126, 189, .12);
      content: "";
    }
    h1 {
      max-width: 9em;
      margin: 0;
      font-size: clamp(2.45rem, 6vw, 4.8rem);
      line-height: 1.05;
      letter-spacing: -.065em;
    }
    .lead {
      max-width: 33em;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.13rem);
      line-height: 1.85;
    }
    .actions { display: flex; align-items: center; gap: 18px; margin-top: 38px; }
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border: 1px solid var(--accent-strong);
      border-radius: 14px;
      color: #f7fcff;
      background: var(--accent-strong);
      box-shadow: 0 12px 28px rgba(15, 102, 159, .2);
      font-size: .92rem;
      font-weight: 760;
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(15, 102, 159, .26); }
    .button:active { transform: translateY(1px); }
    .refresh-note { color: var(--muted); font-size: .75rem; }
    .visual {
      position: relative;
      display: grid;
      min-height: 590px;
      place-items: center;
      overflow: hidden;
      padding: 48px;
      color: #eaf8ff;
      background:
        radial-gradient(circle at 50% 35%, rgba(125, 206, 242, .24), transparent 32%),
        linear-gradient(160deg, #153c58 0%, #0b263b 58%, #081d2d 100%);
    }
    .visual::before,
    .visual::after {
      position: absolute;
      border: 1px solid rgba(146, 214, 244, .13);
      border-radius: 50%;
      content: "";
    }
    .visual::before { width: 420px; height: 420px; }
    .visual::after { width: 290px; height: 290px; }
    .visual-inner { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; }
    .visual img {
      width: clamp(128px, 16vw, 184px);
      height: clamp(128px, 16vw, 184px);
      border-radius: 44px;
      box-shadow: 0 26px 72px rgba(0, 0, 0, .34), 0 0 0 14px rgba(255,255,255,.04);
    }
    .visual strong { margin-top: 38px; font-size: 1.15rem; letter-spacing: .18em; }
    .visual p { max-width: 22em; margin: 12px 0 0; color: #a9c9d9; font-size: .79rem; line-height: 1.7; }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --canvas: #071b2a;
        --canvas-deep: #0d293d;
        --ink: #eaf7fd;
        --muted: #9cb9c9;
        --accent: #68bce8;
        --accent-strong: #2d8fc5;
        --panel: rgba(10, 32, 47, .84);
        --line: rgba(104, 188, 232, .24);
        --shadow: 0 32px 90px rgba(0, 0, 0, .32);
      }
      .maintenance-shell { border-color: rgba(151, 211, 239, .16); }
      .button { color: #f5fbff; background: #176d9d; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .maintenance-shell { animation: arrive .7s cubic-bezier(.16, 1, .3, 1) both; }
      .visual img { animation: breathe 4.8s ease-in-out infinite; }
      @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.99); } }
      @keyframes breathe { 50% { transform: translateY(-8px); } }
    }
    @media (max-width: 760px) {
      main { width: min(100% - 24px, 560px); padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .maintenance-shell { grid-template-columns: 1fr; border-radius: 22px; }
      .copy { min-height: auto; padding: 34px 28px 38px; }
      .brand { margin-bottom: 58px; }
      h1 { font-size: clamp(2.35rem, 12vw, 3.45rem); }
      .lead { margin-top: 22px; }
      .actions { align-items: flex-start; flex-direction: column; margin-top: 30px; }
      .button { width: 100%; }
      .visual { min-height: 270px; padding: 38px 24px; }
      .visual::before { width: 310px; height: 310px; }
      .visual::after { width: 220px; height: 220px; }
      .visual img { width: 112px; height: 112px; border-radius: 32px; }
      .visual strong { margin-top: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="maintenance-shell" aria-labelledby="maintenance-title">
      <div class="copy">
        <a class="brand" href="/" aria-label="重新检查 OOHStory">
          <img src="/icon-192.png" width="48" height="48" alt="">
          <span><strong>OOHStory</strong><small>沉浸阅读空间</small></span>
        </a>
        <span class="status">站点维护中</span>
        <h1 id="maintenance-title">稍作停驻，故事马上继续</h1>
        <p class="lead">我们正在进行短暂维护。阅读、听书与个人书架会在服务恢复后继续保留，请稍后再回来。</p>
        <div class="actions">
          <a class="button" href="/">重新检查</a>
          <span class="refresh-note">页面每 60 秒自动检查一次</span>
        </div>
      </div>
      <aside class="visual" aria-label="OOHStory 品牌画面">
        <div class="visual-inner">
          <img src="/icon-192.png" width="184" height="184" alt="OOHStory 标志">
          <strong>OOH STORY</strong>
          <p>让每一次暂别，都只是下一页故事开始前的留白。</p>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
