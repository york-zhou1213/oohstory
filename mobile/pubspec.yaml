name: oohstory
description: "OOH Story - 免费中文小说阅读与深度拆书"
publish_to: 'none'
version: 1.15.1+38

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.0
  just_audio: ^0.9.46
  provider: ^6.1.4
  go_router: ^15.1.2
  shimmer: ^3.0.0
  flutter_html: ^3.0.0-beta.2
  flutter_markdown: ^0.7.6+2
  path_provider: ^2.1.5
  audio_service: ^0.18.17
  scrollable_positioned_list: ^0.3.8
  file_picker: ^8.3.7
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
