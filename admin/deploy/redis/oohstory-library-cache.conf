# Disposable OOHStory read cache.  Never use this instance for Streams,
# leases, locks, or durable state.
bind 127.0.0.1 ::1
protected-mode yes
port 6380
tcp-backlog 128
timeout 0
tcp-keepalive 300
daemonize no
supervised systemd
logfile ""
databases 1

# Cache loss is expected and every read fails open to MySQL/NAS.
save ""
appendonly no

maxmemory 2gb
maxmemory-policy allkeys-lfu
maxmemory-samples 10
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
