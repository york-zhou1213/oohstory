name: current-client-builds

on:
  workflow_dispatch:
  push:
    branches:
      - "build/current-v*"
    paths:
      - "mobile/**"
      - ".github/workflows/current-client-builds.yml"

permissions:
  contents: read

jobs:
  android:
    name: Android unsigned release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.4"
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Refuse repository-provided release signing material
        shell: bash
        run: |
          set -euo pipefail
          test ! -e mobile/android/key.properties
          test -z "$(find mobile/android -type f \( -name '*.jks' -o -name '*.keystore' \) -print -quit)"
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned Android releases
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release
      - name: Verify and package unsigned Android outputs
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          mkdir -p artifacts
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -d "$android_sdk/build-tools"
          apksigner="$(find "$android_sdk/build-tools" -type f \
            -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mapfile -t matches < <(find build/app/outputs/flutter-apk \
              -maxdepth 1 -type f -name "*${abi}*.apk" -print)
            test "${#matches[@]}" -eq 1
            apk="${matches[0]}"
            if "$apksigner" verify "$apk" >/dev/null 2>&1; then
              echo "release APK is unexpectedly signed: $apk" >&2
              exit 1
            fi
            cp "$apk" \
              "artifacts/OOHStory-v${version}-Android-${abi}-unsigned.apk"
          done
          aab="$(find build/app/outputs/bundle/release -maxdepth 1 \
            -type f -name '*.aab' -print -quit)"
          test -s "$aab"
          if unzip -Z1 "$aab" | grep -Eiq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "release AAB is unexpectedly signed" >&2
            exit 1
          fi
          cp "$aab" "artifacts/OOHStory-v${version}-Android-unsigned.aab"
          (
            cd artifacts
            sha256sum -- *.apk *.aab > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: OOHStory-v1.27.0+75-Android-unsigned
          path: mobile/artifacts/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.4"
          cache: true
      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            appstream clang cmake imagemagick libgtk-3-dev libsecret-1-dev \
            ninja-build pkg-config rpm
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build Linux release
        working-directory: mobile
        run: flutter build linux --release
      - name: Download verified Linux packaging tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
            --output "$RUNNER_TEMP/runtime-x86_64"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            | sha256sum --check --strict
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  $RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            | sha256sum --check --strict
          echo "1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  $RUNNER_TEMP/runtime-x86_64" \
            | sha256sum --check --strict
          chmod 0755 \
            "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
      - name: Package Linux tarball, deb, rpm, and AppImage
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          mkdir -p artifacts
          tar -C build/linux/x64/release/bundle -czf \
            "artifacts/OOHStory-v${version}-Linux-x64.tar.gz" .
          tool/package_linux_deb.sh "$version" artifacts
          tool/package_linux_rpm.sh "$version" artifacts
          tool/package_linux_appimage.sh "$version" artifacts \
            "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" \
            "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            "$RUNNER_TEMP/runtime-x86_64"
      - uses: anchore/sbom-action@v0
        with:
          path: mobile/build/linux/x64/release/bundle
          format: spdx-json
          output-file: mobile/artifacts/OOHStory-Linux.spdx.json
      - name: Verify Linux package metadata and checksums
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          dpkg-deb --info "artifacts/OOHStory-v${version}-Linux-amd64.deb" >/dev/null
          rpm -qpi "artifacts/OOHStory-v${version}-Linux-x86_64.rpm" >/dev/null
          test -x "artifacts/OOHStory-v${version}-Linux-x86_64.AppImage"
          (
            cd artifacts
            find . -maxdepth 1 -type f \
              ! -name '*.sha256' ! -name SHA256SUMS -printf '%f\0' \
              | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: OOHStory-v1.27.0+75-Linux-x64
          path: mobile/artifacts/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.4"
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        working-directory: mobile
        run: flutter build windows --release
      - name: Package portable bundle and unsigned installer
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "OOHStory-v1.27.0+75-Windows-x64.zip"
          Compress-Archive -Path "mobile/build/windows/x64/runner/Release/*" -DestinationPath $archive
          choco install innosetup --no-progress -y
          $env:OOHSTORY_VERSION = "1.27.0+75"
          $env:OOHSTORY_OUTPUT_DIR = $env:RUNNER_TEMP
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" mobile/packaging/windows/OOHStory.iss
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  OOHStory-v1.27.0+75-Windows-x64.zip" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "OOHStory-v1.27.0+75-Windows-x64.sha256")
          $installer = Join-Path $env:RUNNER_TEMP "OOHStory-v1.27.0+75-Windows-x64-Setup-unsigned.exe"
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$installerHash  OOHStory-v1.27.0+75-Windows-x64-Setup-unsigned.exe" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "OOHStory-v1.27.0+75-Windows-x64-Setup-unsigned.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: OOHStory-v1.27.0+75-Windows-x64
          path: |
            ${{ runner.temp }}/OOHStory-v1.27.0+75-Windows-x64.zip
            ${{ runner.temp }}/OOHStory-v1.27.0+75-Windows-x64.sha256
            ${{ runner.temp }}/OOHStory-v1.27.0+75-Windows-x64-Setup-unsigned.exe
            ${{ runner.temp }}/OOHStory-v1.27.0+75-Windows-x64-Setup-unsigned.sha256
          if-no-files-found: error
          retention-days: 14

  ios-ipados:
    name: iPhone and iPad unsigned release
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.4"
          cache: true
      - name: Verify universal device family
        run: grep -Fq 'TARGETED_DEVICE_FAMILY = "1,2";' mobile/ios/Runner.xcodeproj/project.pbxproj
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS and iPadOS release
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OOHStory-v1.27.0+75-iOS-iPadOS-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/build/ios/iphoneos/Runner.app "$archive"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$archive")" \
            > OOHStory-v1.27.0+75-iOS-iPadOS-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OOHStory-v1.27.0+75-iOS-iPadOS-unsigned
          path: |
            ${{ runner.temp }}/OOHStory-v1.27.0+75-iOS-iPadOS-unsigned.zip
            ${{ runner.temp }}/OOHStory-v1.27.0+75-iOS-iPadOS-unsigned.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS unsigned release
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.4"
          cache: true
      - name: Verify secure storage and export entitlements
        shell: bash
        run: |
          grep -Fq '<key>keychain-access-groups</key>' mobile/macos/Runner/Release.entitlements
          grep -Fq '<key>com.apple.security.files.user-selected.read-write</key>' mobile/macos/Runner/Release.entitlements
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Build macOS release
        working-directory: mobile
        run: flutter build macos --release
      - name: Package unsigned zip and DMG
        shell: bash
        run: |
          set -euo pipefail
          app="mobile/build/macos/Build/Products/Release/OOHStory.app"
          archive="$RUNNER_TEMP/OOHStory-v1.27.0+75-macOS-unsigned.zip"
          dmg="$RUNNER_TEMP/OOHStory-v1.27.0+75-macOS-unsigned.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          stage="$(mktemp -d)"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname OOHStory -srcfolder "$stage" -ov -format UDZO "$dmg"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$archive")" > OOHStory-v1.27.0+75-macOS-unsigned.sha256
          shasum -a 256 "$(basename "$dmg")" >> OOHStory-v1.27.0+75-macOS-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OOHStory-v1.27.0+75-macOS-unsigned
          path: |
            ${{ runner.temp }}/OOHStory-v1.27.0+75-macOS-unsigned.zip
            ${{ runner.temp }}/OOHStory-v1.27.0+75-macOS-unsigned.dmg
            ${{ runner.temp }}/OOHStory-v1.27.0+75-macOS-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
