name: current-client-builds

on:
  workflow_dispatch:
  push:
    branches:
      - "build/current-v*"
    paths:
      - "mobile/**"
      - ".github/workflows/current-client-builds.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build Windows release
        working-directory: mobile
        run: flutter build windows --release
      - name: Package and checksum
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "OOHStory-v1.27.0+75-Windows-x64.zip"
          Compress-Archive -Path "mobile/build/windows/x64/runner/Release/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  OOHStory-v1.27.0+75-Windows-x64.zip" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP "OOHStory-v1.27.0+75-Windows-x64.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: OOHStory-v1.27.0+75-Windows-x64
          path: |
            ${{ runner.temp }}/OOHStory-v1.27.0+75-Windows-x64.zip
            ${{ runner.temp }}/OOHStory-v1.27.0+75-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 14

  ios-ipados:
    name: iPhone and iPad unsigned release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify universal device family
        run: grep -Fq 'TARGETED_DEVICE_FAMILY = "1,2";' mobile/ios/Runner.xcodeproj/project.pbxproj
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build unsigned iOS and iPadOS release
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/OOHStory-v1.27.0+75-iOS-iPadOS-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/build/ios/iphoneos/Runner.app "$archive"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$archive")" \
            > OOHStory-v1.27.0+75-iOS-iPadOS-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OOHStory-v1.27.0+75-iOS-iPadOS-unsigned
          path: |
            ${{ runner.temp }}/OOHStory-v1.27.0+75-iOS-iPadOS-unsigned.zip
            ${{ runner.temp }}/OOHStory-v1.27.0+75-iOS-iPadOS-unsigned.sha256
          if-no-files-found: error
          retention-days: 14
