limit_req_zone $binary_remote_addr zone=oohstory_api:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=oohstory_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name reader.example.com www.reader.example.com m.reader.example.com;

    client_max_body_size 1k;
    client_body_timeout 5s;
    keepalive_timeout 20s;
    send_timeout 30s;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/reader.example.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        limit_conn oohstory_conn 20;
        limit_req zone=oohstory_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }
}
