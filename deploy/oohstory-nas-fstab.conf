# Eager boot mount. Keep x-systemd.automount absent: OOHStory requires the NAS
# to be attempted during boot, while nofail lets the host finish booting and
# oohstory-nas-recovery.timer retries until the export becomes available.
192.0.2.20:/export/oohstory-library /srv/oohstory/library nfs4 rw,vers=4.1,proto=tcp,hard,timeo=600,retrans=2,nconnect=4,rsize=1048576,wsize=1048576,noatime,_netdev,nofail,x-systemd.mount-timeout=30s 0 0
