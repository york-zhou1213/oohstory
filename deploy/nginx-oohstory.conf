map $request_method $oohstory_upload_rate_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=ohhstory_general:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=ohhstory_api:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=ohhstory_account:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ohhstory_download:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=ohhstory_auth:10m rate=12r/m;
limit_req_zone $oohstory_upload_rate_key zone=ohhstory_upload_post:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=ohhstory_conn:10m;

# All public mutations are denied unless their exact route is allowlisted.
map "$request_method:$uri" $oohstory_method_allowed {
    default 0;
    ~^(?:GET|HEAD): 1;
    "~^POST:/$" 1;
    "~^POST:/api/v1/books/[A-Za-z0-9_-]+/metrics/(read|download|recommend)$" 1;
    "~^POST:/api/v1/books/[A-Za-z0-9_-]{22}/recommend$" 1;
    "~^POST:/api/v1/books/[A-Za-z0-9_-]{22}/chapters/[1-9][0-9]*/comments$" 1;
    "~^(?:POST|DELETE):/api/v1/paragraph-comments/[0-9a-f-]{36}/thanks$" 1;
    "~^POST:/api/v1/paragraph-comments/[0-9a-f-]{36}/likes$" 1;
    "~^POST:/api/v1/auth/(?:register|login|google(?:/link(?:/start)?)?|verify-email|resend-verification|logout)$" 1;
    "~^PUT:/api/v1/me/state$" 1;
    "~^PUT:/api/v1/me/profile$" 1;
    "~^DELETE:/api/v1/me/state/(?:history|favorites|bookshelf)/[A-Za-z0-9_-]{22}$" 1;
    "~^DELETE:/api/v1/me/avatar$" 1;
    "~^POST:/api/v1/me/uploads$" 1;
    "~^POST:/api/v1/me/novel-submissions$" 1;
    "~^POST:/api/v1/me/notifications(?:/[0-9a-f-]{36})?/read$" 1;
    "~^POST:/api/v1/me/(?:avatar|password|reading-heartbeat)$" 1;
}

upstream oohstory_reader_backend {
    server 127.0.0.1:8091;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name reader.example.com www.reader.example.com m.reader.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/reader.example.com;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://reader.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.reader.example.com m.reader.example.com;

    ssl_certificate /etc/letsencrypt/live/reader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reader.example.com/privkey.pem;
    return 301 https://reader.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reader.example.com;

    # Trust the visitor address only when the connection itself comes from a
    # Cloudflare network. Direct origin requests cannot spoof this header.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    ssl_certificate /etc/letsencrypt/live/reader.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reader.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OOHStorySSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1k;
    client_body_timeout 5s;
    keepalive_timeout 20s;
    send_timeout 30s;
    server_tokens off;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    if ($oohstory_method_allowed = 0) { return 405; }

    location ~* "(?:^|/)(?:\\.|wp-admin|wp-login\\.php|xmlrpc\\.php|vendor/phpunit|cgi-bin|actuator|swagger)" {
        return 404;
    }

    location = /admin { return 404; }
    location ^~ /admin/ { return 404; }
    location ^~ /api/admin/ { return 404; }
    location ^~ /api/v1/admin/ { return 404; }

    location ~ "^/api/v1/books/[A-Za-z0-9_-]{22}/download$" {
        limit_conn ohhstory_conn 4;
        limit_req zone=ohhstory_download burst=3 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
    }

    location ~ "^/api/v1/books/[A-Za-z0-9_-]{22}/metrics/(?:read|download|recommend)$" {
        if ($request_method != POST) { return 405; }
        client_max_body_size 4k;
        limit_conn ohhstory_conn 4;
        limit_req zone=ohhstory_api burst=12 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
    }

    location ~ "^/api/v1/books/[A-Za-z0-9_-]{22}/recommend$" {
        if ($request_method != POST) { return 405; }
        client_max_body_size 4k;
        limit_conn ohhstory_conn 4;
        limit_req zone=ohhstory_account burst=20 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
    }

    location ^~ /api/v1/auth/ {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        client_max_body_size 16k;
        limit_conn ohhstory_conn 4;
        limit_req zone=ohhstory_auth burst=8 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_send_timeout 15s;
    }

    location = /api/v1/me/uploads {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        client_max_body_size 65m;
        client_body_timeout 30s;
        limit_conn ohhstory_conn 2;
        limit_req zone=ohhstory_account burst=40 nodelay;
        limit_req zone=ohhstory_upload_post burst=1 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 240s;
        proxy_send_timeout 60s;
    }

    location = /api/v1/me/novel-submissions {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        client_max_body_size 72m;
        client_body_timeout 45s;
        limit_conn ohhstory_conn 2;
        limit_req zone=ohhstory_account burst=40 nodelay;
        limit_req zone=ohhstory_upload_post burst=1 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 240s;
        proxy_send_timeout 60s;
    }

    location = /api/v1/me/avatar {
        if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) { return 405; }
        client_max_body_size 6m;
        client_body_timeout 20s;
        limit_conn ohhstory_conn 4;
        limit_req zone=ohhstory_account burst=40 nodelay;
        limit_req zone=ohhstory_upload_post burst=1 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    location ^~ /api/v1/me/ {
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE)$) { return 405; }
        client_max_body_size 256k;
        limit_conn ohhstory_conn 6;
        limit_req zone=ohhstory_account burst=40 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    location ~ "^/api/v1/books/[A-Za-z0-9_-]{22}/chapters/[1-9][0-9]*/comments$" {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        client_max_body_size 2k;
        limit_conn ohhstory_conn 6;
        limit_req zone=ohhstory_account burst=40 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
    }

    location ~ "^/api/v1/paragraph-comments/[0-9a-f-]{36}/thanks$" {
        if ($request_method !~ ^(POST|DELETE)$) { return 405; }
        client_max_body_size 1k;
        limit_conn ohhstory_conn 6;
        limit_req zone=ohhstory_account burst=40 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
    }

    location ~ "^/api/v1/paragraph-comments/[0-9a-f-]{36}/likes$" {
        if ($request_method !~ ^POST$) { return 405; }
        client_max_body_size 1k;
        limit_conn ohhstory_conn 6;
        limit_req zone=ohhstory_account burst=40 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
    }

    # Google Identity Services redirect UX posts the ID token to the already
    # authorized site root.  Keep this as an exact, size-bounded route; the
    # application performs Google's double-submit CSRF validation before
    # issuing a session.
    location = / {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        client_max_body_size 16k;
        limit_conn ohhstory_conn 20;
        limit_req zone=ohhstory_general burst=40 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    location /api/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        limit_conn ohhstory_conn 12;
        limit_req zone=ohhstory_api burst=24 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    location / {
        limit_conn ohhstory_conn 20;
        limit_req zone=ohhstory_general burst=40 nodelay;

        proxy_pass http://oohstory_reader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 15s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }
}
