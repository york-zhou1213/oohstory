name: windows-preview

"on":
  push:
    branches:
      - task/TASK-20260823-009-jucy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHIVE_NAME: OohStory-Windows-x64-preview.zip
  # pubspec.lock contains the Flutter 3.32 SDK-pinned package set.
  FLUTTER_VERSION: 3.32.8
  FLUTTER_TOOL_PATCHED_SHA256: 33cf59e3bbf4a61907b6ca656c19ee40505e6eafdc70a17563c882e5fd0bbe6a
  FLUTTER_TOOL_SOURCE_SHA256: f7c7f31d28a8ce3894ca16e4d78940710bec0c06c1d40f360d05f1b3c8e1362c
  MANIFEST_NAME: OohStory-Windows-x64-preview.manifest.json
  WINDOWS_TREE_SHA: cb839a22a2252e32a7f45ca68bd25c79df066c85

jobs:
  build:
    name: Native Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and frozen Windows runner
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "checkout SHA mismatch" }
          $windowsTree = (git rev-parse HEAD:windows).Trim()
          if ($windowsTree -ne $env:WINDOWS_TREE_SHA) { throw "frozen Windows tree mismatch" }

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # The next step mutates this SDK; persisting it would poison a rerun.
          cache: false
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Backport upstream Visual Studio 2026 generator support
        run: |
          $flutterCommand = (Get-Command flutter -ErrorAction Stop).Source
          $flutterRoot = Split-Path -Parent (Split-Path -Parent $flutterCommand)
          $toolSource = Join-Path $flutterRoot 'packages/flutter_tools/lib/src/windows/visual_studio.dart'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          $source = [System.IO.File]::ReadAllText($toolSource).Replace("`r`n", "`n")
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $sourceHash = [Convert]::ToHexString($sha256.ComputeHash($utf8.GetBytes($source))).ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }
          if ($sourceHash -ne $env:FLUTTER_TOOL_SOURCE_SHA256) {
            throw "unexpected Flutter tool source identity: $sourceHash"
          }

          $old = "return switch (_majorVersion) {`n      17 =>"
          $new = "return switch (_majorVersion) {`n      18 => 'Visual Studio 18 2026',`n      17 =>"
          $first = $source.IndexOf($old, [StringComparison]::Ordinal)
          if ($first -lt 0 -or $first -ne $source.LastIndexOf($old, [StringComparison]::Ordinal)) {
            throw 'Flutter tool patch target must occur exactly once'
          }
          $patched = $source.Replace($old, $new)
          [System.IO.File]::WriteAllText($toolSource, $patched, $utf8)

          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $patchedHash = [Convert]::ToHexString($sha256.ComputeHash($utf8.GetBytes($patched))).ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }
          if ($patchedHash -ne $env:FLUTTER_TOOL_PATCHED_SHA256) {
            throw "patched Flutter tool identity mismatch: $patchedHash"
          }

          $cache = Join-Path $flutterRoot 'bin/cache'
          Remove-Item -Force -ErrorAction SilentlyContinue `
            (Join-Path $cache 'flutter_tools.snapshot'), `
            (Join-Path $cache 'flutter_tools.stamp')
          & flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'patched Flutter tool rebuild failed' }

      - name: Record toolchain
        run: |
          flutter --version
          python --version

      - name: Test portable packager
        run: python packaging/windows/test_package_preview.py -v

      - name: Regress tracked-source drift guard
        run: |
          $probePath = 'packaging/windows/test_package_preview.py'
          $original = [System.IO.File]::ReadAllBytes($probePath)
          try {
            $tampered = [byte[]]::new($original.Length + 1)
            [Array]::Copy($original, $tampered, $original.Length)
            $tampered[$tampered.Length - 1] = 10
            [System.IO.File]::WriteAllBytes($probePath, $tampered)
            & git diff --quiet --exit-code $env:GITHUB_SHA --
            if ($LASTEXITCODE -eq 0) { throw 'tracked-source drift guard did not detect mutation' }
          } finally {
            [System.IO.File]::WriteAllBytes($probePath, $original)
          }
          & git diff --quiet --exit-code $env:GITHUB_SHA --
          if ($LASTEXITCODE -ne 0) { throw 'tracked source was not restored after drift regression' }

      - name: Resolve Flutter packages from lockfile
        run: |
          & flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw "lockfile-enforced dependency resolution failed" }
          & git diff --quiet --exit-code $env:GITHUB_SHA --
          if ($LASTEXITCODE -ne 0) {
            $drift = (& git status --short --untracked-files=no) -join "`n"
            throw "tracked source drift after dependency resolution`n$drift"
          }

      - name: Build native Windows release
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP 'flutter-windows-build.log'
          & flutter build windows --release --no-pub 2>&1 | Tee-Object -FilePath $buildLog
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $diagnostics = Get-Content -LiteralPath $buildLog -Tail 40
            $message = ($diagnostics -join "`n").Replace($env:GITHUB_WORKSPACE, '<workspace>')
            $message = $message.Replace($env:USERPROFILE, '<runner-home>')
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Flutter Windows build failed::$message"
            exit $buildExit
          }

      - name: Package and verify unsigned preview
        run: |
          python packaging/windows/package_preview.py create `
            --bundle build/windows/x64/runner/Release `
            --output-dir dist/windows-preview `
            --source-commit $env:GITHUB_SHA `
            --workflow-run-id $env:GITHUB_RUN_ID `
            --windows-tree $env:WINDOWS_TREE_SHA
          python packaging/windows/package_preview.py verify `
            --archive "dist/windows-preview/$env:ARCHIVE_NAME" `
            --manifest "dist/windows-preview/$env:MANIFEST_NAME" `
            --source-commit $env:GITHUB_SHA `
            --workflow-run-id $env:GITHUB_RUN_ID `
            --windows-tree $env:WINDOWS_TREE_SHA

      - name: Upload candidate for clean-runner smoke test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-preview-candidate-${{ github.run_id }}
          path: |
            dist/windows-preview/${{ env.ARCHIVE_NAME }}
            dist/windows-preview/${{ env.MANIFEST_NAME }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  smoke:
    name: Clean-runner launch and first screen
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-preview-candidate-${{ github.run_id }}
          path: candidate

      - name: Verify archive before extraction
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "verifier SHA mismatch" }
          $windowsTree = (git rev-parse HEAD:windows).Trim()
          if ($windowsTree -ne $env:WINDOWS_TREE_SHA) { throw "frozen Windows tree mismatch" }
          python packaging/windows/package_preview.py verify `
            --archive "candidate/$env:ARCHIVE_NAME" `
            --manifest "candidate/$env:MANIFEST_NAME" `
            --source-commit $env:GITHUB_SHA `
            --workflow-run-id $env:GITHUB_RUN_ID `
            --windows-tree $env:WINDOWS_TREE_SHA

      - name: Launch for 15 seconds and capture the first screen
        run: |
          $extractRoot = Join-Path $env:RUNNER_TEMP 'oohstory-preview-smoke'
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'oohstory-preview-evidence'
          New-Item -ItemType Directory -Force -Path $extractRoot, $evidenceRoot | Out-Null
          Expand-Archive -LiteralPath "candidate/$env:ARCHIVE_NAME" -DestinationPath $extractRoot
          $appRoot = Join-Path $extractRoot 'OohStory-Windows-x64-preview'
          $executable = Join-Path $appRoot 'OohStory.exe'
          if (!(Test-Path -LiteralPath $executable -PathType Leaf)) { throw "portable executable missing after extraction" }

          $process = Start-Process -FilePath $executable -WorkingDirectory $appRoot -PassThru
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $windowHandle = [IntPtr]::Zero
          while ($stopwatch.Elapsed.TotalSeconds -lt 15) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) { throw "OohStory exited before 15 seconds" }
            if ($process.MainWindowHandle -ne [IntPtr]::Zero) { $windowHandle = $process.MainWindowHandle }
          }
          if ($windowHandle -eq [IntPtr]::Zero) { throw "OohStory did not expose a native window" }

          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindowCapture {
            [StructLayout(LayoutKind.Sequential)]
            public struct Rect { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr handle, out Rect rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr handle);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr handle, int command);
          }
          '@
          [NativeWindowCapture]::ShowWindow($windowHandle, 9) | Out-Null
          [NativeWindowCapture]::SetForegroundWindow($windowHandle) | Out-Null
          Start-Sleep -Seconds 2
          $rect = [NativeWindowCapture+Rect]::new()
          if (![NativeWindowCapture]::GetWindowRect($windowHandle, [ref]$rect)) { throw "cannot read OohStory window bounds" }
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          if ($width -lt 320 -or $height -lt 240) { throw "OohStory window bounds are invalid" }
          $bitmap = New-Object -TypeName System.Drawing.Bitmap -ArgumentList $width, $height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
            $screenshot = Join-Path $evidenceRoot 'first-screen.png'
            $bitmap.Save($screenshot, [System.Drawing.Imaging.ImageFormat]::Png)
          } finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          if ((Get-Item -LiteralPath $screenshot).Length -eq 0) { throw "first-screen evidence is empty" }

          $closeRequested = $process.CloseMainWindow()
          if (!$closeRequested -or !$process.WaitForExit(10000)) {
            if (!$process.HasExited) { $process.Kill() }
            throw "OohStory did not terminate gracefully"
          }

          $manifest = Get-Content -Raw -LiteralPath "candidate/$env:MANIFEST_NAME" | ConvertFrom-Json
          $executablePath = 'OohStory-Windows-x64-preview/OohStory.exe'
          $executableRecords = @($manifest.files | Where-Object { $_.path -ceq $executablePath })
          if ($executableRecords.Count -ne 1) { throw "manifest must contain exactly one canonical executable record" }
          $executableRecord = $executableRecords[0]
          $evidence = [ordered]@{
            schema_version = 1
            source_commit = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            archive_sha256 = $manifest.archive.sha256
            executable_sha256 = $executableRecord.sha256
            survived_seconds = 15
            native_window = [ordered]@{ width = $width; height = $height }
            screenshot_sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $screenshot).Hash.ToLowerInvariant()
            graceful_termination = $true
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 -LiteralPath (Join-Path $evidenceRoot 'launch-evidence.json')
          Copy-Item -LiteralPath "candidate/$env:ARCHIVE_NAME", "candidate/$env:MANIFEST_NAME" -Destination $evidenceRoot

          $notice = "archive_sha256=$($manifest.archive.sha256); archive_size=$($manifest.archive.size_bytes); executable_sha256=$($executableRecord.sha256); screenshot_sha256=$($evidence.screenshot_sha256); survived_seconds=15; graceful_termination=true"
          Write-Output "::notice title=Verified Windows preview::$notice"

      - name: Upload verified unsigned Windows preview
        id: final_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OohStory-Windows-x64-preview
          path: ${{ runner.temp }}/oohstory-preview-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Record artifact identity
        run: |
          Write-Output "::notice title=Windows preview artifact::artifact_id=${{ steps.final_artifact.outputs.artifact-id }}; artifact_digest=${{ steps.final_artifact.outputs.artifact-digest }}; source_commit=$env:GITHUB_SHA; workflow_run_id=$env:GITHUB_RUN_ID"
          @"
          Artifact ID: ${{ steps.final_artifact.outputs.artifact-id }}
          Artifact URL: ${{ steps.final_artifact.outputs.artifact-url }}
          Artifact digest: ${{ steps.final_artifact.outputs.artifact-digest }}
          Source commit: $env:GITHUB_SHA
          Workflow run ID: $env:GITHUB_RUN_ID
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
