[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-learning-control-plane"
version = "1.1.0"
description = "Fail-closed engineering learning and memory audit controls"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
learning-control-plane = "learning_control_plane.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
